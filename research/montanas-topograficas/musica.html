<script>
(function () {
  'use strict';
  const MT = window.MT;
  const Q = new URLSearchParams(location.search);
  const VERSION = 'musica-loop01';
  const $ = (id) => document.getElementById(id);
  const cv = $('c'), cx = cv.getContext('2d');
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const prom = () => clamp((S.act - 0.15) / 0.6); // 0 calma … 1 pieza en su punto más alto
  const sst = (a, b, x) => { const u = clamp((x - a) / (b - a)); return u * u * (3 - 2 * u); };
  const MANUAL = Q.get('reloj') === 'manual';

  // ── lienzo ────────────────────────────────────────────────────────────────
  let W = 0, H = 0, DPR = 1;
  function ajusta() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = +Q.get('w') || innerWidth; H = +Q.get('h') || innerHeight;
    if (Q.get('w')) DPR = 1;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    try { fxResize(); } catch (e) {} // aún sin Hydra la primera vez
  }
  ajusta(); window.addEventListener('resize', ajusta);

  // ── estado ────────────────────────────────────────────────────────────────
  const S = {
    t: 0, terr: null, semilla: '', rows: null, pluma: 0, oscuro: Q.get('oscuro') !== '0',
    hue: 200, giro: 140, exag0: 1,
    b: 0, m: 0, a: 0, flash: 0, shift: 0, act: 0, // bandas ya suavizadas, golpe, "actividad"
    exag: 1, levanto: 0, banco: [], pidiendo: false, mensaje: '', prev: null, penDur: 7, cambios: [], ultimoCambio: 0, auto: true,
    mezcla: 0, mezclaAuto: false, codigo: '', presetN: 0, hydraError: '', editorEnCaptura: false,
    vista: Q.get('vista') || 'completa', // datos | filas | completa: las etapas de la pieza, para el proceso
  };

  // ── el terreno: lo levanta el motor en un worker (no se toca) ─────────────────
  const N_ROWS = 112, N_COLS = 260;
  let obrero = null, idPeticion = 0;
  const pendientes = new Map();
  function pideTerreno(semilla) {
    return new Promise((res, rej) => {
      if (!obrero) {
        obrero = new Worker('obrero.js');
        obrero.onmessage = (e) => {
          const p = pendientes.get(e.data.id); if (!p) return; pendientes.delete(e.data.id);
          if (e.data.error) p.rej(new Error(e.data.error)); else p.res(e.data);
        };
      }
      const id = ++idPeticion, t0 = performance.now();
      pendientes.set(id, { res: (d) => res({ ...d, ms: performance.now() - t0 }), rej });
      obrero.postMessage({ s: String(semilla), tipo: 'terreno', id });
    });
  }
  // el mapa de alturas visto desde arriba, en gris (alto = claro): entra a Hydra como s1 (HYDRA.md §5.1, 20 oct 2026)
  const mapaCv = document.createElement('canvas'); mapaCv.width = mapaCv.height = 360;
  function pintaMapa(T) {
    const G = T.G, k = mapaCv.getContext('2d'), im = k.createImageData(G, G);
    for (let i = 0; i < G * G; i++) { const v = Math.round(255 * clamp(T.h[i])); im.data[4 * i] = im.data[4 * i + 1] = im.data[4 * i + 2] = v; im.data[4 * i + 3] = 255; }
    if (mapaCv.width !== G) mapaCv.width = mapaCv.height = G;
    k.putImageData(im, 0, 0);
  }
  function filas(T) { // el relieve ya muestreado en N_ROWS × (N_COLS+1): lo que se dibuja cada cuadro
    const G = T.G, h = T.h, out = new Float32Array(N_ROWS * (N_COLS + 1));
    for (let r = 0; r < N_ROWS; r++) {
      const v = 1 - r / (N_ROWS - 1); // r = 0 es la fila de atrás
      const y = clamp(v) * (G - 1), yi = Math.min(G - 2, Math.floor(y)), fy = y - yi;
      for (let c = 0; c <= N_COLS; c++) {
        const x = (c / N_COLS) * (G - 1), xi = Math.min(G - 2, Math.floor(x)), fx = x - xi, k = yi * G + xi;
        out[r * (N_COLS + 1) + c] = h[k] * (1 - fx) * (1 - fy) + h[k + 1] * fx * (1 - fy) + h[k + G] * (1 - fx) * fy + h[k + G + 1] * fx * fy;
      }
    }
    return out;
  }
  const semillaAzar = () => String(1 + Math.floor(Math.random() * 999999));
  // El banco: BANCO_N montañas ya levantadas esperando turno (el worker las calienta de una en una).
  // Un cambio es instantáneo; lo que tarda (1–4 s por lámina) pasa mientras suena lo anterior.
  const BANCO_N = 3;
  async function levanta(semilla, usar, o = {}) {
    S.mensaje = 'levantando ' + semilla + '…';
    const d = usar || await pideTerreno(semilla);
    if (o.barrido && S.rows) { S.prev = { rows: S.rows, hue: S.hue, giro: S.giro }; S.penDur = o.dur || 1.2; }
    else { S.prev = null; S.penDur = PLUMA_SEG; }
    S.terr = d.terreno; S.rows = filas(d.terreno); S.semilla = String(semilla); S.levanto = d.ms;
    pintaMapa(d.terreno);
    const az = MT.rng(S.semilla + ':musica-color');
    S.hue = az() * 360; S.giro = az.range(90, 200); S.exag0 = az.range(0.85, 1.25);
    S.pluma = 0; S.mensaje = ''; S.ultimoCambio = S.t;
    if (X.rng) nuevaFrase(true); // el texto empieza otra frase con la montaña nueva
    rellena();
  }
  function rellena() {
    if (S.pidiendo || S.banco.length >= BANCO_N) return;
    S.pidiendo = true;
    const s = semillaAzar();
    pideTerreno(s).then((d) => { S.banco.push({ semilla: s, d }); S.pidiendo = false; rellena(); })
      .catch(() => { S.pidiendo = false; });
  }
  // cambio de montaña: la pluma barre de atrás hacia adelante y lo que deja atrás ya es la nueva
  function cambia(motivo) {
    if (!S.banco.length || !S.rows) return false;
    const b = S.banco.shift(), p = prom();
    S.cambios.push({ t: +S.t.toFixed(2), de: S.semilla, a: b.semilla, motivo, espera: +(S.t - S.ultimoCambio).toFixed(2), banco: S.banco.length });
    if (S.cambios.length > 200) S.cambios.shift();
    levanta(b.semilla, b.d, { barrido: true, dur: 0.7 + 1.1 * (1 - p) }); // más activo, barrido más rápido
    return true;
  }
  // ¿toca cambiar? un golpe fuerte con actividad, pero no antes de un mínimo que se acorta si la pieza está viva
  function cambioAuto(golpe) {
    if (!S.auto || !S.rows || S.pluma < 1 || !S.banco.length) return;
    const espera = S.t - S.ultimoCambio, p = prom(), minimo = 14 - 8 * p;
    if (golpe && S.flash > 0.8 && p > 0.2 && espera > minimo) cambia('golpe');
    else if (espera > 40) cambia('tiempo');
  }
  async function otra(semilla) {
    if (semilla != null) return levanta(semilla);
    if (S.banco.length && S.rows) return cambia('tecla');
    return levanta(semillaAzar());
  }

  // ── audio ─────────────────────────────────────────────────────────────────
  const A = { ctx: null, an: null, bytes: null, fuente: null, modo: 'demo', ganancia: 1, pico: [0.12, 0.12, 0.12],
              prev: null, fm: 0, fv: 0, ultimo: -9, audioEl: null, nm: 0.3 };
  function aseguraCtx() {
    if (A.ctx) { if (A.ctx.state === 'suspended') A.ctx.resume(); return; }
    A.ctx = new (window.AudioContext || window.webkitAudioContext)();
    A.an = A.ctx.createAnalyser(); A.an.fftSize = 2048; A.an.smoothingTimeConstant = 0.3;
    A.bytes = new Uint8Array(A.an.frequencyBinCount); A.prev = new Uint8Array(A.an.frequencyBinCount);
  }
  function desconecta() { try { if (A.fuente) A.fuente.disconnect(); } catch (e) {} A.fuente = null; if (A.audioEl) { A.audioEl.pause(); } }
  async function usaMicro(deviceId) {
    aseguraCtx(); desconecta();
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: {
        deviceId: deviceId ? { exact: deviceId } : undefined,
        echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      A.fuente = A.ctx.createMediaStreamSource(st); A.fuente.connect(A.an); A.modo = 'micro';
      const ds = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput');
      const sel = $('dispositivo'); sel.hidden = false; sel.innerHTML = '';
      for (const d of ds) { const o = document.createElement('option'); o.value = d.deviceId; o.textContent = d.label || 'entrada'; sel.appendChild(o); }
      const act = st.getAudioTracks()[0].getSettings().deviceId; if (act) sel.value = act;
      S.mensaje = '';
    } catch (e) { S.mensaje = 'sin micro: ' + e.name; A.modo = 'demo'; }
  }
  function usaArchivo(file) {
    aseguraCtx(); desconecta();
    if (!A.audioEl) { A.audioEl = new Audio(); A.audioEl.loop = true; A.audioEl.crossOrigin = 'anonymous'; }
    A.audioEl.src = URL.createObjectURL(file);
    if (!A.srcEl) { A.srcEl = A.ctx.createMediaElementSource(A.audioEl); A.srcEl.connect(A.ctx.destination); }
    A.fuente = A.srcEl; A.srcEl.connect(A.an); A.audioEl.play(); A.modo = 'archivo';
  }
  // Pista de audio real decodificada: se analiza con la misma lógica de bytes que el AnalyserNode
  // (ventana de Hann, dB entre -100 y -30, suavizado 0.3) y marca el tiempo con el reloj de la pieza,
  // así sirve igual con el reloj manual (capturas reproducibles) y en vivo.
  function fft(re, im) {
    const n = re.length;
    for (let i = 1, j = 0; i < n; i++) { let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
    for (let len = 2; len <= n; len <<= 1) {
      const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
      for (let i = 0; i < n; i += len) {
        let cr = 1, ci = 0;
        for (let k = 0; k < len / 2; k++) {
          const a = i + k, b = a + len / 2, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
          re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
          const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
        }
      }
    }
  }
  const FN = 2048, VENT = new Float32Array(FN).map((_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (FN - 1)));
  const FR = new Float32Array(FN), FI = new Float32Array(FN);
  function bytesDePista() {
    const b = A.buf, c0 = b.getChannelData(0), c1 = b.numberOfChannels > 1 ? b.getChannelData(1) : c0, sr = b.sampleRate;
    const pos = (S.t - A.t0) % b.duration, fin = Math.floor(pos * sr), ini = fin - FN;
    for (let i = 0; i < FN; i++) { const k = ini + i, v = k >= 0 && k < c0.length ? 0.5 * (c0[k] + c1[k]) : 0; FR[i] = v * VENT[i]; FI[i] = 0; }
    fft(FR, FI);
    for (let k = 0; k < FN / 2; k++) {
      const mag = Math.hypot(FR[k], FI[k]) / FN;
      A.sm[k] = 0.3 * A.sm[k] + 0.7 * mag;
      const db = 20 * Math.log10(Math.max(A.sm[k], 1e-10));
      A.bytes[k] = clamp(Math.round((db + 100) / 70 * 255), 0, 255);
    }
  }
  async function usaPista(url) {
    try {
      const ctx = A.ctx || (A.ctx = new (window.AudioContext || window.webkitAudioContext)());
      const ab = await (await fetch(url)).arrayBuffer();
      A.buf = await ctx.decodeAudioData(ab);
      A.bytes = new Uint8Array(FN / 2); A.prev = new Uint8Array(FN / 2); A.sm = new Float32Array(FN / 2);
      A.t0 = S.t; BB = null; A.modo = 'pista'; A.pico = [0.12, 0.12, 0.12];
      if (!MANUAL) { // sonar de verdad, si el navegador deja
        try { const src = ctx.createBufferSource(); src.buffer = A.buf; src.loop = true; src.connect(ctx.destination); await ctx.resume(); src.start(); } catch (e) {}
      }
      return { ok: true, dur: A.buf.duration, sr: A.buf.sampleRate };
    } catch (e) { S.mensaje = 'sin pista: ' + e.name; return { ok: false, e: String(e) }; }
  }
  const banda = (hz0, hz1) => { const f = (A.buf && A.modo === 'pista' ? A.buf.sampleRate : A.ctx.sampleRate) / 2048; return [Math.max(1, Math.round(hz0 / f)), Math.round(hz1 / f)]; };
  let BB = null;
  // devuelve [grave, medio, agudo, flujo] crudos en 0..1
  function lee() {
    if (!BB) BB = [banda(30, 160), banda(160, 2000), banda(2000, 9000)];
    if (A.modo === 'pista') bytesDePista(); else A.an.getByteFrequencyData(A.bytes);
    const v = BB.map(([i0, i1]) => { let s = 0; for (let i = i0; i < i1; i++) s += A.bytes[i]; return s / Math.max(1, i1 - i0) / 255; });
    let fl = 0; const [i0, i1] = [BB[0][0], BB[1][1]];
    for (let i = i0; i < i1; i++) fl += Math.max(0, A.bytes[i] - A.prev[i]);
    A.prev.set(A.bytes);
    return [v[0], v[1], v[2], fl / Math.max(1, i1 - i0) / 255];
  }
  // el "sin audio": un 4x4 a 124 bpm con secciones, para probar y para respaldo en el escenario
  function demo(t) {
    const bpm = 124, fase = t * bpm / 60, f = fase % 1, beat = Math.floor(fase) % 4, comp = Math.floor(fase / 16);
    const seccion = [0.55, 0.8, 1, 1, 0.35, 0.9][((comp % 6) + 6) % 6];
    const kick = Math.exp(-f * 6.5), hat = Math.exp(-((fase * 2) % 1) * 9) * (0.6 + 0.4 * Math.sin(t * 0.9));
    const clap = (beat === 1 || beat === 3) ? Math.exp(-f * 8) : 0;
    const g = (0.12 + 0.88 * kick) * seccion;
    const m = clamp(0.28 + 0.3 * Math.sin(t * 0.6) * seccion + 0.55 * clap * seccion);
    const a = clamp(0.2 + 0.7 * hat * seccion + 0.1 * Math.sin(t * 7.3));
    const disparo = f < 0.04 ? 1 : 0;
    return [g, m, a, disparo ? 0.5 : 0.02];
  }
  function actualiza(dt) {
    let g, m, a, fl;
    if (A.modo === 'demo' || !A.ctx) [g, m, a, fl] = demo(S.t);
    else {
      [g, m, a, fl] = lee();
      // control automático de ganancia: el pico decae lento, así el ajuste no depende del mixer
      const v = [g, m, a], d = Math.pow(0.5, dt / 6);
      for (let i = 0; i < 3; i++) { A.pico[i] = Math.max(0.1, A.pico[i] * d, v[i]); v[i] = Math.pow(clamp(v[i] * A.ganancia / A.pico[i]), 1.4); }
      [g, m, a] = v;
    }
    if (!Number.isFinite(g)) g = 0; if (!Number.isFinite(m)) m = 0; if (!Number.isFinite(a)) a = 0; if (!Number.isFinite(fl)) fl = 0; // un NaN se queda para siempre en el suavizado
    // suavizado con ataque rápido y caída lenta
    const sube = 1 - Math.pow(0.001, dt * 6), baja = 1 - Math.pow(0.001, dt * 1.6);
    S.b += (g - S.b) * (g > S.b ? sube : baja);
    S.m += (m - S.m) * (m > S.m ? sube : baja);
    S.a += (a - S.a) * (a > S.a ? sube : baja);
    // golpe: el flujo espectral por encima de su propia media + dos desviaciones
    A.fm += (fl - A.fm) * Math.min(1, dt * 1.5); A.fv += (Math.abs(fl - A.fm) - A.fv) * Math.min(1, dt * 1.5);
    const golpe = fl > A.fm + 2.2 * A.fv + 0.012 && S.t - A.ultimo > 0.14;
    if (golpe) { A.ultimo = S.t; S.flash = 1; S.shift += 38; }
    S.flash *= Math.pow(0.02, dt); S.shift *= Math.pow(0.35, dt);
    S.golpes = (S.golpes || 0) + (golpe ? 1 : 0);
    // actividad = nivel + cuánto sube sobre su propio promedio lento (~9 s): una pieza que se queda
    // arriba no se queda en 1 para siempre; los crescendos pesan más que el volumen parejo
    const nivel = (S.b + S.m + S.a) / 3 + S.flash * 0.3;
    A.nm += (nivel - A.nm) * Math.min(1, dt / 9);
    const rel = clamp(0.5 + (nivel - A.nm) * 2.4);

  function despierta() { $('hud').classList.remove('dormido'); clearTimeout(dormir); if (!MANUAL) dormir = setTimeout(() => $('hud').classList.add('dormido'), 5000); }
  window.addEventListener('mousemove', despierta);
  $('bMic').onclick = () => usaMicro();
  $('bDemo').onclick = () => { desconecta(); A.modo = 'demo'; };
  $('bArchivo').onclick = () => $('archivo').click();
  $('archivo').onchange = (e) => { if (e.target.files[0]) usaArchivo(e.target.files[0]); };
  $('dispositivo').onchange = (e) => usaMicro(e.target.value);
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const k = e.key.toLowerCase();
    if (k === 'r') otra();
    else if (k === 's') { const v = prompt('Semilla:', S.semilla); if (v) otra(v.trim()); }
    else if (k === 'l') S.oscuro = !S.oscuro;
    else if (k === 'n') { if (!cambia('tecla')) otra(); }
    else if (k === 'b') S.auto = !S.auto;
    else if (k === 'c') { S.cascada = !S.cascada; S.mixto = false; }
    else if (k === 'v') { S.mixto = !S.mixto; S.cascada = S.mixto; }
    else if (k === '[') { S.mezclaAuto = false; mezcla(S.mezcla - 0.05); }
    else if (k === ']') { S.mezclaAuto = false; mezcla(S.mezcla + 0.05); }
    else if (/^[0-9]$/.test(k) && (+k || 10) <= PRESETS.length) usaPreset((+k || 10) - 1);   // 1–9 y 0 = el 10 (numérico: con 15 presets, '2' <= '15' era falso)
    else if (k === 'a') S.mezclaAuto = !S.mezclaAuto;
    else if (k === 'e') { edBox.classList.toggle('oculto'); if (!edBox.classList.contains('oculto')) edTxt.focus(); }
    else if (k === 'm') usaMicro();
    else if (k === 'h') $('hud').classList.toggle('dormido');
    else if (k === 'p') guardaPNG('s' + S.semilla);
    else if (e.key === 'ArrowUp') { A.ganancia = Math.min(8, A.ganancia * 1.2); e.preventDefault(); }
    else if (e.key === 'ArrowDown') { A.ganancia = Math.max(0.2, A.ganancia / 1.2); e.preventDefault(); }
    despierta();
  });

  // ── arranque ───────────────────────────────────────────────────────────────
  const a0 = Q.get('audio');
  if (a0 === 'mic' && !MANUAL) usaMicro();
  const pista0 = Q.get('pista'); // ?pista=ruta/relativa.wav (servida por servir_musica.py)
  if (pista0) usaPista('/pista?f=' + encodeURIComponent(pista0));
  window.musica = { paso, guardaPNG, S, A, otra, X, cascada: (v) => { S.cascada = !!v; S.mixto = false; }, mixto: (v) => { S.mixto = !!v; S.cascada = !!v; }, cambia, usaPista, rellena, lienzo, hydra: { evalua, mezcla, usaPreset, PRESETS, editor: (v) => { S.editorEnCaptura = !!v; }, get listo() { return !!hy; }, get error() { return S.hydraError; } }, colorNuevo: () => nuevoColor(), vista: (v) => { S.vista = v; }, estado: () => ({ semilla: S.semilla, levanto: S.levanto, t: S.t, pluma: S.pluma, b: S.b, m: S.m, a: S.a, exag: S.exag, hue: S.hue, tipo: S.terr && S.terr.tipo, version: VERSION }) };
  if (MANUAL) { $('hud').classList.add('dormido'); if (Q.get('editor') !== '1') edBox.classList.add('oculto'); } else despierta();
  if (Q.get('preset')) usaPreset(+Q.get('preset') - 1);
  if (Q.get('mezcla') != null) mezcla(+Q.get('mezcla'));
  otra(Q.get('semilla') || semillaAzar()).then(() => { window.musicaLista = true; });
  if (!MANUAL) requestAnimationFrame(marco);
})();
</script>
